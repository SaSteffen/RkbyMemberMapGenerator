[project]
name = "rkby-member-map-generator"
version = "0.1.0"
description = "Local tools for Team Rynkeby Hamburg: member maps, rider pairing suggestions, and a birthday calendar, built from locally-held team data."
readme = "README.md"
license = "Unlicense"
authors = [
    { name = "Sascha Steffen", email = "sascha.steffen@itemis.de" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "PyYAML>=6.0.0",
    "jsonschema>=4.23.0",
    "Pillow>=11.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "nbconvert>=7.16.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "responses>=0.25.0",
    "nbstripout>=0.8.0",
]

[tool.ruff]
# Spec Kit's vendored workflow scripts aren't project code; don't lint them.
extend-exclude = [".specify"]

[tool.pytest.ini_options]
# Lets tests import `scripts.<name>` (namespace package, no __init__.py needed)
# without installing the project or hand-rolling sys.path tweaks per test file.
pythonpath = ["."]
