<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Rynkeby Hamburg — Interactive Member Map</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="map"></div>

    <!--
      Classic external scripts, not modules, never fetched dynamically --
      basemap-pmtiles.js/map-data.js must load before the bundled app
      script runs, and all three must survive being opened via file://
      (research.md §2, §10). Do not change these tags' position/type:
      vite-plugin-singlefile inlines the built JS/CSS around them but
      leaves them untouched.

      basemap-pmtiles.js is unconditional -- the same built index.html is
      used for both build variants; in hosted mode (RKBY_BASEMAP_URL set)
      the referenced file simply doesn't exist and the browser's failed
      local load has no effect, since main.js only reads
      window[data.basemap.variable] when data.basemap.mode === "embedded".
    -->
    <script src="./basemap-pmtiles.js"></script>
    <script src="./map-data.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
