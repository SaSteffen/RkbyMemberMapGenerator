<!-- Obfuscated/synthetic: shape of the real intranet's login page, as returned both
     for an initial unauthenticated visit and for a failed login POST (the form is
     redisplayed with an error banner). No real credentials or member data. -->
<html>
<body>
<div class="error">Username or password is wrong, please try again.</div>
<form action="/login" method="post">
  <input type="text" id="loginusername" name="loginusername">
  <input type="password" id="loginpassword" name="loginpassword">
  <input type="checkbox" id="loginremember" name="loginremember" value="1">
  <input type="hidden" name="UseMd5" value="UseMd5">
  <input type="hidden" name="dologinnoredirect" value="dologinnoredirect">
  <input type="submit" id="loginButton" name="dologin" value="Login">
</form>
</body>
</html>
